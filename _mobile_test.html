<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
function run(width) {
  var f = document.createElement('iframe');
  document.body.appendChild(f);
  f.style.width = width + 'px';
  f.style.height = '800px';
  f.style.border = '0';
  f.src = '/index.html';
  setTimeout(function () {
    try {
      var doc = f.contentDocument;
      var cw = doc.documentElement.clientWidth;
      var sw = doc.documentElement.scrollWidth;
      var right = [];
      doc.querySelectorAll('*').forEach(function (e) {
        var r = e.getBoundingClientRect();
        if (r.right > cw + 2) right.push(e.tagName + '#' + e.id + '.' + String(e.className).slice(0, 12) + ' L' + Math.round(r.left) + ' W' + Math.round(r.width) + ' R' + Math.round(r.right));
      });
      var links = doc.querySelectorAll('link[rel=stylesheet]');
      var sheets = [];
      links.forEach(function (l) { sheets.push(l.href); });
      var pre = document.createElement('pre');
      pre.textContent = 'WIDTH ' + width + ' :: client=' + cw + ' :: scroll=' + sw + ' :: rightOverflow=' + right.length + ' :: ' + right.slice(0, 10).join(' || ') + ' :: sheets=' + sheets.join(' / ');
      document.body.appendChild(pre);
    } catch (err) { var pre = document.createElement('pre'); pre.textContent = 'WIDTH ' + width + ' :: ERR ' + String(err); document.body.appendChild(pre); }
  }, 8000);
}
</script>
</head>
<body>
<script>run(768); run(760); run(700);</script>
</body>
</html>
